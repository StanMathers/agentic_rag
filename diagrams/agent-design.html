<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · LangGraph · agentic_rag</p>
    <h1>How the agent answers a question</h1>

    <svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-design-title agent-design-desc">
      <title id="agent-design-title">How the agentic RAG graph answers a question</title>
      <desc id="agent-design-desc">Flowchart of a LangGraph agent that routes a question to the vector store or web search, grades retrieved documents, generates an answer, and falls back to web search when the answer is not grounded or does not address the question.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ARROWS ============ -->
      <line x1="360" y1="80" x2="360" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="200" x2="360" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M460 152 H712 Q720 152 720 160 V328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="296" x2="360" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="384" x2="360" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="356" x2="640" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M720 384 V452 Q720 460 712 460 H440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="488" x2="360" y2="532" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="628" x2="360" y2="668" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M460 580 H832 Q840 580 840 572 V364 Q840 356 832 356 H800" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ============ ARROW LABELS ============ -->
      <rect x="296" y="214" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="324" y="223" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ON-TOPIC</text>

      <rect x="552" y="132" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OFF-TOPIC</text>

      <rect x="496" y="336" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ANY IRRELEVANT</text>

      <rect x="272" y="400" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="409" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALL RELEVANT</text>

      <rect x="536" y="440" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="580" y="449" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">+ WEB RESULTS</text>

      <rect x="304" y="640" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="328" y="649" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USEFUL</text>

      <rect x="580" y="560" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="616" y="569" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NOT USEFUL</text>

      <!-- ============ SIDE NOTES ============ -->
      <text x="244" y="148" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">vectorstore covers agents,</text>
      <text x="244" y="160" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">prompting, LLM attacks</text>
      <text x="244" y="576" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1 · hallucination grader</text>
      <text x="244" y="588" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">2 · answer grader</text>

      <!-- ============ NODES ============ -->
      <rect x="280" y="32" width="160" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="280" y="32" width="160" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="360" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User question</text>
      <text x="360" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app.invoke()</text>

      <polygon points="360,104 460,152 360,200 260,152" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Route question</text>
      <text x="360" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LLM router</text>

      <rect x="280" y="240" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="240" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retrieve</text>
      <text x="360" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Chroma · nomic-embed</text>

      <rect x="280" y="328" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="328" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Grade documents</text>
      <text x="360" y="370" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">drop irrelevant docs</text>

      <rect x="640" y="328" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="328" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="720" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web search</text>
      <text x="720" y="370" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tavily · top 3</text>

      <rect x="280" y="432" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="432" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="458" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generate</text>
      <text x="360" y="474" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RAG prompt + docs</text>

      <polygon points="360,532 460,580 360,628 260,580" fill="#f5f5f5"/>
      <polygon points="360,532 460,580 360,628 260,580" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="360" y="576" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Grounded and</text>
      <text x="360" y="592" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">on-question?</text>

      <rect x="280" y="668" width="160" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="280" y="668" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="360" y="690" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Answer</text>
      <text x="360" y="704" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">END</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="736" x2="960" y2="736" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="752" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="768" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="778" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="180" y="768" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="212" y="778" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Graph node</text>

      <rect x="320" y="768" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="352" y="778" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">External service</text>

      <polygon points="484,774 496,768 508,774 496,780" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="516" y="778" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">LLM decision (edge)</text>

      <line x1="652" y1="776" x2="680" y2="776" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="688" y="778" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Corrective loop</text>

      <line x1="812" y1="776" x2="840" y2="776" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="848" y="778" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Transition</text>
    </svg>
  </div>
</body>
</html>
