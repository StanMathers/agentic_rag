<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · FastAPI · agentic_rag</p>
    <h1>How the backend is wired</h1>

    <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backend-architecture-title backend-architecture-desc">
      <title id="backend-architecture-title">Agentic RAG backend architecture</title>
      <desc id="backend-architecture-desc">Architecture of the dockerized FastAPI backend: a client calls the API, which routes queries to a service running the LangGraph agent and ingestion requests to a pipeline that fetches web pages, embeds them with Ollama and writes them to a bind-mounted Chroma store; the agent reads that store and calls Ollama and Tavily.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONES ============ -->
      <rect x="200" y="96" width="480" height="376" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="212" y="100" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="216" y="109" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DOCKER · agentic_rag_backend</text>

      <text x="760" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HOST · INTERNET</text>

      <!-- ============ ARROWS ============ -->
      <!-- Client → FastAPI -->
      <line x1="160" y1="284" x2="232" y2="284" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- FastAPI → Query service -->
      <path d="M312 240 V176 Q312 168 320 168 H464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- FastAPI → Ingestion service -->
      <path d="M312 328 V392 Q312 400 320 400 H464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Query → Chroma (read) -->
      <line x1="554" y1="208" x2="554" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Ingestion → Chroma (write) -->
      <line x1="554" y1="360" x2="554" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Query → Tavily -->
      <line x1="644" y1="148" x2="760" y2="148" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Query → Ollama -->
      <path d="M644 188 H688 Q696 188 696 196 V260 Q696 268 704 268 H760" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Ingestion → Ollama -->
      <path d="M644 380 H720 Q728 380 728 372 V308 Q728 300 736 300 H760" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Ingestion → Web pages -->
      <line x1="644" y1="420" x2="760" y2="420" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- ============ ARROW LABELS ============ -->
      <rect x="168" y="264" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="196" y="273" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP :8005</text>

      <rect x="368" y="148" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="388" y="157" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

      <rect x="364" y="380" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="388" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INGEST</text>

      <rect x="562" y="224" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="578" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>

      <rect x="562" y="332" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="582" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE</text>

      <rect x="676" y="128" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="702" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEARCH</text>

      <rect x="628" y="220" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="658" y="229" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM CALLS</text>

      <rect x="676" y="332" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="698" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMBED</text>

      <rect x="680" y="400" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="702" y="409" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FETCH</text>

      <!-- ============ NODES ============ -->
      <!-- Client -->
      <rect x="40" y="256" width="120" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="256" width="120" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="100" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="100" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">curl · Swagger UI</text>

      <!-- FastAPI app -->
      <rect x="232" y="240" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="240" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI app</text>
      <text x="312" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">uvicorn · request-id</text>
      <text x="312" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GET /v1/health</text>

      <!-- Query service (focal) -->
      <rect x="464" y="128" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="128" width="180" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="554" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Query service</text>
      <text x="554" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /v1/query/query</text>
      <text x="554" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runs the LangGraph agent</text>

      <!-- Chroma store -->
      <rect x="464" y="252" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="252" width="180" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="554" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chroma store</text>
      <text x="554" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bind mount ./.chroma</text>

      <!-- Ingestion service -->
      <rect x="464" y="360" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="360" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="554" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingestion service</text>
      <text x="554" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /v1/ingestion/ingest</text>
      <text x="554" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unstructured · split · embed</text>

      <!-- Tavily -->
      <rect x="760" y="116" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="116" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="840" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tavily</text>
      <text x="840" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web search API</text>

      <!-- Ollama -->
      <rect x="760" y="252" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="252" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="840" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ollama (host)</text>
      <text x="840" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">qwen3:1.7b · nomic-embed</text>

      <!-- Source web pages -->
      <rect x="760" y="388" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="388" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="840" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Source web pages</text>
      <text x="840" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">URLs to ingest</text>

      <!-- Chroma server (in compose, not wired) -->
      <rect x="760" y="484" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="484" width="160" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="840" y="508" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chroma server</text>
      <text x="840" y="524" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">compose :8000 · unused</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="572" x2="920" y2="572" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="604" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="72" y="614" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Client</text>

      <rect x="136" y="604" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="168" y="614" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Service</text>

      <rect x="236" y="604" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="268" y="614" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Data store</text>

      <rect x="348" y="604" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="380" y="614" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">External / host</text>

      <rect x="480" y="604" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="512" y="614" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Defined, not wired</text>

      <line x1="628" y1="612" x2="656" y2="612" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="664" y="614" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">HTTP call</text>

      <line x1="748" y1="612" x2="776" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="784" y="614" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">In-process call</text>
    </svg>
  </div>
</body>
</html>
