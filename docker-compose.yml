services:
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - agentic_rag

  agentic_rag_backend:
    build: .
    image: agentic-rag-backend:latest
    container_name: agentic_rag_backend
    restart: unless-stopped
    ports:
      - "8005:8005"
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.chroma:/app/.chroma
    networks:
      - agentic_rag

volumes:
  chroma_data:

networks:
  agentic_rag:
    name: agentic_rag
    driver: bridge
